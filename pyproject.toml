[project]
name = "times-fm-benchmark"
version = "0.1.0"
description = "Multi-variable time series benchmark"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "black>=26.5.1",
    "chronos-forecasting>=0.1.0",
    "gradio>=6.26.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.1",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "peft>=0.20.0",
    "plotly>=7.0.0",
    "pmdarima>=2.1.1",
    "pytest>=9.1.1",
    "requests>=2.34.2",
    "scikit-learn>=1.5.0",
    "scipy>=1.14.0",
    "statsmodels>=0.14.0",
    "timesfm>=3.0.1",
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "xgboost>=2.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
